version: '3.8'

# FLOPY-NET: Federated Learning and SDN Observatory Platform
# System Version: v1.0.0-alpha.9
# Registry: abdulmelink (Docker Hub)
#
# Network addressing is centralized in:
#   - config/network_addressing.json (source of truth)
#   - .env file (generated by scripts/sync_network_config.py)
#
# To update IPs, edit config/network_addressing.json then run:
#   python scripts/sync_network_config.py

# ============================================================================
# YAML ANCHORS - Shared configuration blocks
# ============================================================================

x-common-env: &common-env
  NETWORK_MODE: docker
  DOCKER_COMPOSE_ENV: "true"
  USE_STATIC_IP: "true"
  LOG_LEVEL: INFO

x-network-env: &network-env
  SUBNET_PREFIX: ${SUBNET_PREFIX}
  CLIENT_IP_RANGE: ${CLIENT_IP_RANGE}
  SERVER_IP_RANGE: ${SERVER_IP_RANGE}
  POLICY_IP_RANGE: ${POLICY_IP_RANGE}
  CONTROLLER_IP_RANGE: ${CONTROLLER_IP_RANGE}
  OVS_IP_RANGE: ${OVS_IP_RANGE}
  NORTHBOUND_IP_RANGE: ${NORTHBOUND_IP_RANGE}
  COLLECTOR_IP: ${COLLECTOR_IP}

x-node-ips: &node-ips
  NODE_IP_FL_SERVER: ${NODE_IP_FL_SERVER}
  NODE_IP_POLICY_ENGINE: ${NODE_IP_POLICY_ENGINE}
  NODE_IP_SDN_CONTROLLER: ${NODE_IP_SDN_CONTROLLER}
  NODE_IP_COLLECTOR: ${NODE_IP_COLLECTOR}
  NODE_IP_OPENVSWITCH: ${NODE_IP_OPENVSWITCH}
  NODE_IP_FL_CLIENT_1: ${NODE_IP_FL_CLIENT_1}
  NODE_IP_FL_CLIENT_2: ${NODE_IP_FL_CLIENT_2}

x-version-info: &version-info
  SERVICE_VERSION: v1.0.0-alpha.9
  BUILD_DATE: "2025-11-26"

x-privileged-service: &privileged-service
  privileged: true
  cap_add:
    - NET_ADMIN

# ============================================================================
# SERVICES
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # Policy Engine - Central control, enforces security and resource policies
  # --------------------------------------------------------------------------
  policy-engine:
    build:
      context: .
      dockerfile: docker/flopynet_policy_engine.Dockerfile
    image: abdulmelink/flopynet-policy-engine:v1.0.0-alpha.9
    container_name: policy-engine
    <<: *privileged-service
    environment:
      <<: [*common-env, *network-env, *node-ips, *version-info]
      SERVICE_TYPE: policy-engine
      HOST: 0.0.0.0
      POLICY_PORT: ${POLICY_PORT}
      POLICY_CONFIG: /app/config/policies/policy_config.json
      POLICY_FUNCTIONS_DIR: /app/config/policy_functions
      FL_SERVER_PORT: ${FL_SERVER_PORT}
      COLLECTOR_PORT: ${COLLECTOR_PORT}
    networks:
      flopynet_network:
        ipv4_address: ${NODE_IP_POLICY_ENGINE}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${POLICY_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POLICY_PORT}:${POLICY_PORT}"

  # --------------------------------------------------------------------------
  # FL Server - Coordinates federated learning training
  # --------------------------------------------------------------------------
  fl-server:
    build:
      context: .
      dockerfile: docker/flopynet_fl_server.Dockerfile
    image: abdulmelink/flopynet-server:v1.0.0-alpha.9
    container_name: fl-server
    <<: *privileged-service
    depends_on:
      policy-engine:
        condition: service_healthy
    environment:
      <<: [*common-env, *network-env, *node-ips, *version-info]
      SERVICE_TYPE: fl-server
      HOST: 0.0.0.0
      FL_SERVER_PORT: ${FL_SERVER_PORT}
      METRICS_PORT: 9091
      POLICY_ENGINE_HOST: policy-engine
      POLICY_ENGINE_PORT: ${POLICY_PORT}
      MIN_CLIENTS: 1
      MIN_AVAILABLE_CLIENTS: 1
    networks:
      flopynet_network:
        ipv4_address: ${NODE_IP_FL_SERVER}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # FL Client 1 - Performs local training
  # --------------------------------------------------------------------------
  fl-client-1:
    build:
      context: .
      dockerfile: docker/flopynet_fl_client.Dockerfile
    image: abdulmelink/flopynet-client:v1.0.0-alpha.9
    container_name: fl-client-1
    <<: *privileged-service
    depends_on:
      fl-server:
        condition: service_healthy
      policy-engine:
        condition: service_healthy
    environment:
      <<: [*common-env, *network-env, *node-ips, *version-info]
      SERVICE_TYPE: fl-client
      SERVICE_ID: 1
      CLIENT_ID: client-1
      SERVER_HOST: fl-server
      POLICY_ENGINE_HOST: policy-engine
      MAX_RECONNECT_ATTEMPTS: -1
      RETRY_INTERVAL: 5
      MAX_RETRIES: 30
    networks:
      flopynet_network:
        ipv4_address: ${NODE_IP_FL_CLIENT_1}

  # --------------------------------------------------------------------------
  # FL Client 2 - Performs local training
  # --------------------------------------------------------------------------
  fl-client-2:
    build:
      context: .
      dockerfile: docker/flopynet_fl_client.Dockerfile
    image: abdulmelink/flopynet-client:v1.0.0-alpha.9
    container_name: fl-client-2
    <<: *privileged-service
    depends_on:
      fl-server:
        condition: service_healthy
      policy-engine:
        condition: service_healthy
    environment:
      <<: [*common-env, *network-env, *node-ips, *version-info]
      SERVICE_TYPE: fl-client
      SERVICE_ID: 2
      CLIENT_ID: client-2
      SERVER_HOST: fl-server
      POLICY_ENGINE_HOST: policy-engine
      MAX_RECONNECT_ATTEMPTS: -1
      RETRY_INTERVAL: 5
      MAX_RETRIES: 30
    networks:
      flopynet_network:
        ipv4_address: ${NODE_IP_FL_CLIENT_2}

  # --------------------------------------------------------------------------
  # Collector - Aggregates metrics from all services
  # --------------------------------------------------------------------------
  collector:
    build:
      context: .
      dockerfile: docker/flopynet_collector.Dockerfile
    image: abdulmelink/flopynet-collector:v1.0.0-alpha.9
    container_name: collector
    <<: *privileged-service
    depends_on:
      fl-server:
        condition: service_healthy
      policy-engine:
        condition: service_healthy
    ports:
      - "8083:${COLLECTOR_PORT}"
    environment:
      <<: [*common-env, *network-env, *node-ips, *version-info]
      SERVICE_TYPE: collector
      NETWORK_MONITOR_ENABLED: "true"
      FL_SERVER_HOST: fl-server
      FL_SERVER_PORT: 8081
      POLICY_ENGINE_HOST: policy-engine
      POLICY_ENGINE_URL: http://policy-engine:${POLICY_PORT}
      SDN_CONTROLLER_URL: http://sdn-controller:8181
      POLICY_INTERVAL_SEC: 5
      FL_INTERVAL_SEC: 5
      NETWORK_INTERVAL_SEC: 5
      EVENT_INTERVAL_SEC: 5
    networks:
      flopynet_network:
        ipv4_address: ${NODE_IP_COLLECTOR}

  # --------------------------------------------------------------------------
  # SDN Controller - Ryu-based OpenFlow Controller
  # --------------------------------------------------------------------------
  sdn-controller:
    build:
      context: .
      dockerfile: docker/flopynet_controller.Dockerfile
    image: abdulmelink/flopynet-sdn-controller:v1.0.0-alpha.9
    container_name: sdn-controller
    <<: *privileged-service
    depends_on:
      policy-engine:
        condition: service_healthy
    environment:
      <<: [*common-env, *network-env, *node-ips, *version-info]
      SERVICE_TYPE: sdn-controller
      CONTROLLER_HOST: 0.0.0.0
      CONTROLLER_PORT: 6633
      REST_PORT: 8181
      POLICY_ENGINE_HOST: policy-engine
    networks:
      flopynet_network:
        ipv4_address: ${NODE_IP_SDN_CONTROLLER}
    ports:
      - "8181:8181"

  # --------------------------------------------------------------------------
  # OpenVSwitch - Software-defined networking switch
  # --------------------------------------------------------------------------
  openvswitch:
    build:
      context: .
      dockerfile: docker/flopynet_openvswitch.Dockerfile
    image: abdulmelink/openvswitch:v1.0.0-alpha.9
    container_name: openvswitch
    <<: *privileged-service
    depends_on:
      sdn-controller:
        condition: service_started
    environment:
      <<: [*common-env, *network-env, *node-ips, *version-info]
      SERVICE_TYPE: openvswitch
      OVS_NUM_PORTS: 16
      OVS_USER_MODE: "yes"
      OVS_DATAPATH_TYPE: netdev
      OVS_BRIDGE_NAME: br0
      SDN_CONTROLLER_HOST: sdn-controller
      SDN_CONTROLLER_PORT: 6633
      OVS_PROTOCOL: OpenFlow13
      OVS_FAIL_MODE: standalone
      WAIT_FOR_SERVICES_TIMEOUT: 30
      WAIT_FOR_SERVICES_REQUIRED: "false"
    networks:
      flopynet_network:
        ipv4_address: ${NODE_IP_OPENVSWITCH}

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  flopynet_network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24
          gateway: 192.168.100.1
